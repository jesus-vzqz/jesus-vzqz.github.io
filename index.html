---
layout: default
---

<div class="posts">
  {% for post in site.posts %}
    <article class="post">
      <!-- Título de la Publicación -->
      <h2>
        <a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a>
      </h2>

      <!-- Fecha de la Publicación (opcional) -->
      <div class="post-date">
        Fecha {{ post.date | date: "%B %e, %Y" }}
      </div>

      <!-- Enlace "Read More" -->
      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Leer más</a>
    </article>
  {% endfor %}
</div>
