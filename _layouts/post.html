---
layout: default
---

<article class="post">
  <!-- Título Principal -->
  <header class="post-header">
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span>Publicado el {{ page.date | date: "%B %e, %Y" }}</span>
      {% if page.author %}
        <span>por {{ page.author }}</span>
      {% endif %}
    </div>
  </header>

  <!-- Contenido del Post -->
  <div class="post-content">
    {{ content }}
  </div>

  <!-- Fecha y Autor -->
  <footer class="post-footer">
    <div class="post-date">
      Escrito el {{ page.date | date: "%B %e, %Y" }}
    </div>
  </footer>


</article>
