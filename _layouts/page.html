---
layout: default
---

<div class="page-content">
  <article class="page">
    <!-- Encabezado -->
    <header class="page-header">
      <h1>{{ page.title }}</h1>
      {% if page.author or page.date %}
        <div class="page-meta">
          {% if page.author %}
            <span>Por {{ page.author }}</span>
          {% endif %}
          {% if page.date %}
            <span>Publicado el {{ page.date | date: "%B %e, %Y" }}</span>
          {% endif %}
        </div>
      {% endif %}
    </header>

    <!-- Contenido Principal -->
    <div class="page-body">
      {{ content }}
    </div>
  </article>
</div>
